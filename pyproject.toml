[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storygen"
version = "0.1.0"
description = "Українська проза: генерація та автоматичне оцінювання"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["openai>=2,<3", "pydantic>=2,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3,<4", "python-multipart>=0.0.18,<1"]
browser = ["playwright>=1.40,<2", "httpx2>=2,<3"]

[project.scripts]
storygen-eval = "storygen.evaluation.cli:main"
storygen = "storygen.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"storygen.evaluation" = ["resources/*.txt", "resources/*.json"]
"storygen.storage" = ["migrations/*.sql"]
"storygen.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
"storygen.generation" = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
