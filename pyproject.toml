[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storygen"
version = "0.1.0"
description = "Українська проза: генерація та автоматичне оцінювання"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["openai>=2,<3", "pydantic>=2,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "markdown-it-py>=4.2,<5"]

[project.optional-dependencies]
local-tokens = ["tokenizers==0.23.3", "jinja2>=3,<4"]
dev = ["tokenizers==0.23.3", "pytest>=8,<10", "pypdf>=6,<7", "pdfplumber>=0.11,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3,<4", "python-multipart>=0.0.18,<1"]
publication = ["Pillow>=11,<13", "lxml>=6,<7", "reportlab>=4,<5"]
browser = ["playwright>=1.40,<2", "httpx2>=2,<3"]
mcp = ["mcp==2.3.0"]
keys = ["keyring>=25,<26"]
desktop = ["pystray>=0.19,<0.20", "Pillow>=11,<13", "keyring>=25,<26"]
build = ["pyinstaller>=6,<7", "packaging>=24"]

[project.scripts]
storygen-local-tokens = "storygen.token_budget.local_cli:main"
storygen-eval = "storygen.evaluation.cli:main"
storygen = "storygen.server:main"
storygen-tokens = "storygen.token_budget.cli:main"
storygen-budget = "storygen.billing.cli:main"
storygen-mcp = "storygen.mcp.bridge:main"

[project.gui-scripts]
# No console window: the launcher of the installed build (DESKTOP-001).
storygen-desktop = "storygen.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"storygen.evaluation" = ["resources/*.txt", "resources/*.json"]
"storygen.storage" = ["migrations/*.sql"]
"storygen.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.json", "static/templates/*.md", "static/licenses/*.txt"]
"storygen.generation" = ["resources/*.txt", "resources/*.json"]
"storygen.publication" = ["resources/fb2/*.xsd", "resources/fb2/*.json", "resources/fonts/*.ttf", "resources/fonts/*.txt", "resources/fonts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
markers = ["req(*ids): точковий зв’язок тесту з Requirement ID; звіряється з docs/verification/traceability.json"]
