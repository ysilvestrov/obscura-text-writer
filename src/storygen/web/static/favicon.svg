<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Глибокий винний фон зі скругленими кутами -->
  <rect width="64" height="64" rx="14" fill="#6B1D2F" />

  <!-- Тонка внутрішня рамка для преміального вигляду -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#F7F4EF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Перо ручки (кольору теплої слонової кістки) -->
  <path d="M32 8 L46 28 L40 52 L24 52 L18 28 Z" fill="#F7F4EF" />

  <!-- Розріз пера від кінчика до центру -->
  <line x1="32" y1="8" x2="32" y2="27" stroke="#6B1D2F" stroke-width="2.5" stroke-linecap="round" />

  <!-- Замкова шпарина всередині пера (символ таємниці та 18+) -->
  <circle cx="32" cy="29" r="4.5" fill="#6B1D2F" />
  <path d="M29.5 31 L34.5 31 L36 42 L28 42 Z" fill="#6B1D2F" />

  <!-- Основа пера (манжета) -->
  <rect x="22" y="54" width="20" height="3" rx="1.5" fill="#D97706" />
</svg>
