<!doctype html>
<html lang="{{ ui_locale(request) }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title{% block title_attributes %}{% endblock %}>{% block title %}Obscura Text Writer{% endblock %}</title><meta name="application-name" content="Obscura"><meta name="apple-mobile-web-app-title" content="Obscura"><meta name="theme-color" content="#6B1D2F"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><link rel="stylesheet" href="/static/app.css"></head>
<body><header class="topbar"><a class="brand-lockup" href="/" aria-label="{{ t('m_18b34fec0a38') }}" data-i18n-attrs='{"aria-label": "m_18b34fec0a38"}'><img class="brand-icon" src="/static/favicon.svg" width="32" height="32" alt=""><span class="brand-name">Obscura</span><span class="brand-descriptor">Text Writer</span></a>{% set links=app_links() %}{% if links %}<nav class="app-links" aria-label="{{ t('app.link.group') }}" data-i18n-attrs='{"aria-label": "app.link.group"}'>{% for link in links %}<a class="app-link" href="{{ link.url }}" target="_blank" rel="noopener noreferrer" data-i18n="{{ link.key }}">{{ t(link.key) }}</a>{% endfor %}</nav>{% endif %}<nav class="locale-switch" aria-label="Interface language"><button type="button" data-ui-locale="uk" aria-label="Українська">UA</button><button type="button" data-ui-locale="en" aria-label="English">EN</button></nav></header><div id="notice" role="status" hidden><span class="notice-message"></span><button id="notice-close" type="button" aria-label="{{ t('m_ffad51bdf4cc') }}" title="{{ t('m_ffad51bdf4cc') }}" data-i18n-attrs='{"aria-label": "m_ffad51bdf4cc", "title": "m_ffad51bdf4cc"}'><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>{% block content %}{% endblock %}<script type="module" src="/static/api.js"></script>{% block scripts %}{% endblock %}</body></html>
